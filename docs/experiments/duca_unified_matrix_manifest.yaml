primary_scientific_claim: >-
  Under a strict total budget of 6000 successful detector optimizer updates and a
  fixed pre-backbone acquisition budget of K=384 from T=768, scale-stabilized
  semantic onset, offset, action-core, and coverage evidence with bounded adaptive
  allocation improves official THUMOS14 temporal action detection relative to an
  otherwise matched semantic-prior legacy allocation, without changing the
  detector head, detection losses, NMS, split, or evaluator.

claim_boundaries:
  - The primary paper result is pre-backbone acquisition only and uses Dense VideoMAE-S.
  - Corrected physical-time propagation is a separately identified representation factor.
  - Feature Taylor supervision is a teacher refinement, not a claim that Taylor is new to H65.
  - Mixture-of-Depths is an efficiency/Pareto extension, not the primary accuracy mechanism.
  - Historical H65 and shared dense AdaTAD values are descriptive anchors, not matched causal controls.

common_contract:
  dataset: THUMOS14
  split:
    train_videos: 200
    validation_videos: 211
  input_frames: 768
  selected_frames: 384
  selector_output:
    exact_k: true
    unique: true
    strictly_increasing: true
    original_time_coordinates: true
  detector_backend: official_derived_AdaTAD_ActionFormer
  unchanged_surfaces:
    - ActionFormer classification and regression objectives
    - official THUMOS14 evaluator
    - tIoU thresholds [0.3, 0.4, 0.5, 0.6, 0.7]
    - soft-NMS algorithm and parameters
    - train and validation identities
  training:
    total_epochs: 60
    successful_optimizer_updates: 6000
    terminal_epoch_zero_based: 59
    terminal_state_key: state_dict_ema
    checkpoint_interval_epochs_max: 5
    validation_best_checkpoint_forbidden: true
    extra_THUMOS_supervised_stage_before_update_zero_forbidden: true
    common_public_pretrain_only_before_update_zero: true
  seeds:
    development: 3407
    confirmation: [4407, 5407, 6407]
    development_seed_excluded_from_final_seed_statistics: true
  inference:
    save_raw_predictions: true
    load_from_cached_raw_predictions: false
    map_to_original_time_before_nms: true
  statistics:
    video_cluster_bootstrap_draws: 10000
    bootstrap_shards: 16
    hierarchical_seed_video_bootstrap: true

phase_field_contract:
  source_grid: native_scout_temporal_grid
  inputs:
    semantic_prior: ASFormer_pre_sigmoid_action_logits
    motion_prior: legacy_dual_phase_low_resolution_temporal_motion_score
  cross_prior_rule: identical_smoothing_transition_quota_and_exact_k_path_with_no_feature_leakage_between_priors
  arithmetic: float32
  gaussian_scales: [1.5, 3.0]
  fields:
    core: sigmoid_of_smoothed_logit
    onset: relu_of_scale_normalized_first_derivative
    offset: relu_of_negative_scale_normalized_first_derivative
    curvature: absolute_scale_normalized_second_derivative_as_weak_local_reranker_only
  robust_normalization:
    method: valid_region_quantile_or_MAD
    statistics_detached: true
  selection_order: [scaffold, onset, offset, core, global_refill]
  fixed_quota:
    scaffold: 128
    onset: 64
    offset: 64
    core: 128
  adaptive_quota:
    minima:
      scaffold: 96
      onset: 32
      offset: 32
      core: 64
    remaining_budget: 160
    allocation: deterministic_evidence_mass_with_caps_and_largest_remainder_rounding
  invariants:
    - phase-exclusive sequential masking
    - temporal NMS for onset and offset candidates
    - exact-K deterministic refill
    - valid-mask awareness
    - maximum-gap diagnostic and configured bound
    - no GT, annotation, teacher prediction, or cached held-out prediction at inference

physical_time_contract:
  implementation: reuse_ContinuousTimeScaleAdaptiveConv1d
  timestamp_pyramid_matches_feature_pyramid: true
  geometry_detached_from_selector_gradient: true
  branches:
    local:
      support: constant_physical_span
    context:
      support: scale_covariant_span
      residual_gate_initialization: zero
  forbidden:
    - calling 2_times_2_power_l a constant physical receptive field
    - multiplying pyramid stride twice
    - silently repairing duplicate timestamps
  required_diagnostics:
    - uniform_grid_standard_conv_parity
    - timestamp_inverse_roundtrip_error
    - invalid_or_clamped_tap_ratio_per_level
    - physical_span_per_level

attribution_contract:
  baseline_teacher: selected_input_absolute_grad_times_input
  candidate_teacher: detector_feature_signed_deletion_rank
  feature_levels: [P0, P1]
  formula: relu(-(detached_gradient * detached_feature).sum(channel))
  autograd:
    create_graph: false
    retain_graph: true
    target_detached: true
  update_period_successful_steps: 4
  target_ema: true
  supervision: pairwise_or_listwise_ranking
  exploration: uniform_companion_or_stratified_exploration
  required_gate:
    metric: Spearman_with_real_legal_one_swap_loss_change
    minimum_improvement_over_baseline_teacher: 0.05

mod_contract:
  name: Mixture_of_Depths
  primary_role: efficiency_extension
  final_capacity: 0.65
  capacity_schedule_successful_steps:
    - {start: 0, end: 1500, start_value: 1.0, end_value: 1.0}
    - {start: 1500, end: 3500, start_value: 1.0, end_value: 0.75, interpolation: cosine}
    - {start: 3500, end: 5000, start_value: 0.75, end_value: 0.65, interpolation: cosine}
    - {start: 5000, end: 6000, start_value: 0.65, end_value: 0.65}
  hard_route: topk_on_router_logits
  temperature_role: soft_surrogate_optimization_only
  dense_parity_at_capacity_one: exact
  per_sample_k_uses_valid_tokens_only: true
  padding_tokens_selected: false
  dense_companion_period_successful_steps: 8
  required_efficiency_gate:
    max_avg_map_loss_pp: 0.30
    min_measured_backbone_compute_reduction_fraction: 0.25
    min_measured_end_to_end_latency_improvement_fraction: 0.10

schedules:
  default_20_20_20:
